services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-backend:latest
    container_name: laravel_backend_container
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - SEED_DATABASE=true # Seeds DB with test user on startup
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-buddy_script}
      - DB_USERNAME=${DB_USERNAME:-laravel}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - buddy_network
    volumes:
      - backend-uploads:/var/www/html/public/uploads

  db:
    image: postgres:15-alpine
    container_name: postgres_backend_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-buddy_script}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    networks:
      - buddy_network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  buddy_network:
    name: buddy_network

volumes:
  postgres-data:
  backend-uploads:
