name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Laravel API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, zip, bcmath, opcache, gd, intl

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Prepare Release Directory
        run: |
          mkdir -p deploy
          rsync -av ./ deploy/ --exclude='node_modules' --exclude='tests' --exclude='.git' --exclude='.github' --exclude='storage/logs/*' --exclude='storage/framework/cache/data/*' --exclude='storage/framework/sessions/*' --exclude='storage/framework/views/*' --exclude='.env' --exclude='database/sqlite' --exclude='Dockerfile*' --exclude='docker-compose*' --exclude='docker-entrypoint*' --exclude='supervisord*' --exclude='nginx.conf*'

      - name: Deploy Backend via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_passphrase: ${{ secrets.SSH_PASSKEY }}
          port: ${{ secrets.SSH_PORT }}
          local_path: './deploy/*'
          remote_path: ${{ secrets.SFTP_BACKEND_PATH }}

      - name: Run Remote Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSKEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.SFTP_BACKEND_PATH }}
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
