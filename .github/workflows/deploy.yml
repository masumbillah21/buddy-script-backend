name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Laravel API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, zip, bcmath, opcache, gd, intl

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Prepare Release Directory
        run: |
          mkdir -p deploy
          rsync -av ./ deploy/ --exclude='node_modules' --exclude='tests' --exclude='.git' --exclude='.github' --exclude='storage/logs/*' --exclude='storage/framework/cache/data/*' --exclude='storage/framework/sessions/*' --exclude='storage/framework/views/*' --exclude='.env' --exclude='database/sqlite' --exclude='Dockerfile*' --exclude='docker-compose*' --exclude='docker-entrypoint*' --exclude='supervisord*' --exclude='nginx.conf*'

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-passphrase: ${{ secrets.SSH_PASSKEY }}

      - name: Deploy Backend via SCP
        run: |
          scp -P ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -r ./deploy/* ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SFTP_BACKEND_PATH }}

      - name: Run Remote Commands via SSH
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.SFTP_BACKEND_PATH }}
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
          EOF
