name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Laravel API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, zip, bcmath, opcache, gd, intl

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Deploy Backend via SSH/Rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.SSH_PASSKEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: "./"
          TARGET: ${{ secrets.SFTP_BACKEND_PATH }}
          EXCLUDE: "/node_modules/, /tests/, /.git/, /.github/, /storage/logs/, /storage/framework/cache/data/, /storage/framework/sessions/, /storage/framework/views/, /.env, /database/sqlite/, /Dockerfile*, /docker-compose*, /docker-entrypoint*, /supervisord*, /nginx.conf*"

      - name: Run Remote Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSKEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.SFTP_BACKEND_PATH }}
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
