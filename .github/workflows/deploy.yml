name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Laravel API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, zip, bcmath, opcache, gd, intl

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Upload Files via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSKEY }}
          port: ${{ secrets.SSH_PORT }}
          local-dir: ./
          server-dir: ${{ secrets.SFTP_BACKEND_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/storage/logs/*
            **/storage/framework/cache/data/*
            **/storage/framework/sessions/*
            **/storage/framework/views/*
            **/.env
            **/database/sqlite/**
            **/Dockerfile*
            **/docker-compose*
            **/docker-entrypoint*
            **/supervisord*
            **/nginx.conf*
          state-name: .ftp-deploy-sync-state-backend.json

      - name: Run Remote Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSKEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.SFTP_BACKEND_PATH }}
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
